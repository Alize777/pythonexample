
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stylized To-Do List</title>
  <link rel="stylesheet" href="style3.css">
</head>
<body>

  <h1>My To-Do List</h1>

  <ul class="todo-list">

    <li>
      <input type="checkbox" id="task1">
      <label for="task1">Learn HTML</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://developer.mozilla.org/en-US/docs/Web/HTML" target="_blank">HTML Guide</a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task2">
      <label for="task2">Learn CSS</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://developer.mozilla.org/en-US/docs/Web/CSS" target="_blank">CSS Guide</a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task3">
      <label for="task3">Practice Python</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://www.python.org/" target="_blank">Python Website</a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="task4">
      <label for="task4">Learn Cybersecurity</label>
      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://www.cisa.gov/" target="_blank">Cybersecurity Guide</a>
        </li>
      </ul>
    </li>

  </ul>

</body>
</html>
