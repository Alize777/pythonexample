
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Blog Post Card</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>
  <div class="blog-post-card">
    <img
      class="post-img"
      src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
      alt="A beautiful nature landscape"
    >

    <div class="post-content">
      <h2 class="post-title">Discover the Beauty of Nature</h2>
      <p class="post-excerpt">
        Explore beautiful landscapes and discover new places.
      </p>
      <a class="read-more">Read More</a>
    </div>
  </div>
</body>
</html>
